<title>Project · Registry</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#FBF6F4; --surface:#FFFFFF; --surface-2:#F6ECEA;
    --ink:#2B2230; --ink-soft:#6B5F6A; --line:#EADCD8;
    --accent:#C43C77; --accent-ink:#8E2455; --accent-soft:#F6DAE7;
    --radius:16px; --shadow:0 1px 2px rgba(43,34,48,.06),0 12px 32px rgba(140,36,85,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17121B; --surface:#1F1926; --surface-2:#271F30;
      --ink:#F3EAF0; --ink-soft:#B29FB0; --line:#342A3D;
      --accent:#E86AA0; --accent-ink:#F2A9C9; --accent-soft:#37202F;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17121B; --surface:#1F1926; --surface-2:#271F30;
    --ink:#F3EAF0; --ink-soft:#B29FB0; --line:#342A3D;
    --accent:#E86AA0; --accent-ink:#F2A9C9; --accent-soft:#37202F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px; margin:0 auto; padding:clamp(20px,4vw,44px) clamp(16px,4vw,32px) 72px}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:24px}
  .back{display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--accent-ink);
    font-weight:600; font-size:.9rem}
  .back:hover{text-decoration:underline}
  .gh{font-size:.82rem; color:var(--ink-soft); text-decoration:none}
  .gh:hover{color:var(--accent-ink)}
  .doc{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:clamp(22px,4vw,40px)}
  .doc h1{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:clamp(1.8rem,4.4vw,2.5rem);
    line-height:1.08; margin:0 0 4px; letter-spacing:-.01em; text-wrap:balance}
  .doc h2{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.35rem; margin:30px 0 10px;
    padding-top:18px; border-top:1px solid var(--line)}
  .doc h3{font-size:1.02rem; margin:22px 0 8px}
  .doc p{margin:0 0 12px}
  .doc ul{margin:0 0 14px; padding-left:20px}
  .doc li{margin:5px 0}
  .doc hr{border:0; border-top:1px solid var(--line); margin:22px 0}
  .doc strong{color:var(--ink)}
  .doc code{font-family:"JetBrains Mono",ui-monospace,monospace; font-size:.85em;
    background:var(--surface-2); padding:1px 6px; border-radius:6px; color:var(--accent-ink); word-break:break-word}
  .twrap{overflow-x:auto; margin:0 0 16px}
  table{border-collapse:collapse; width:100%; font-size:.92rem}
  th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top}
  th{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-ink);
    white-space:nowrap; width:1%}
  tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
  .msg{color:var(--ink-soft); padding:40px 0; text-align:center}
  a{color:var(--accent-ink)}
</style>

<div class="wrap">
  <div class="topbar">
    <a class="back" href="./">← All projects</a>
    <a class="gh" id="ghlink" href="#" target="_blank" rel="noopener">View source on GitHub ↗</a>
  </div>
  <article class="doc" id="doc"><p class="msg">Loading…</p></article>
</div>

<script>
  const REPO = "https://github.com/kotharivijay/project-registry/blob/main/projects/";
  const params = new URLSearchParams(location.search);
  const id = (params.get("id") || "").replace(/[^A-Za-z0-9._-]/g, "");
  const doc = document.getElementById("doc");

  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    return s;
  }
  function splitRow(line){
    return line.trim().replace(/^\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
  }
  function renderMd(md){
    const lines = md.replace(/\r\n/g,"\n").split("\n");
    let html="", i=0;
    while(i<lines.length){
      const line=lines[i];
      if(/^\s*$/.test(line)){ i++; continue; }
      // table
      if(/^\s*\|/.test(line) && i+1<lines.length && /^\s*\|?[\s:|-]*-{2,}[\s:|-]*$/.test(lines[i+1])){
        const header=splitRow(line); i+=2; const rows=[];
        while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(splitRow(lines[i])); i++; }
        html+='<div class="twrap"><table><thead><tr>'+header.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
        rows.forEach(r=>{ html+="<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>"; });
        html+="</tbody></table></div>"; continue;
      }
      let m;
      if(m=line.match(/^#\s+(.*)/)){ html+="<h1>"+inline(m[1])+"</h1>"; i++; continue; }
      if(m=line.match(/^##\s+(.*)/)){ html+="<h2>"+inline(m[1])+"</h2>"; i++; continue; }
      if(m=line.match(/^###\s+(.*)/)){ html+="<h3>"+inline(m[1])+"</h3>"; i++; continue; }
      if(/^---+\s*$/.test(line)){ html+="<hr>"; i++; continue; }
      // list with multi-line items
      if(/^\s*-\s+/.test(line)){
        html+="<ul>";
        while(i<lines.length && /^\s*-\s+/.test(lines[i])){
          let item=lines[i].replace(/^\s*-\s+/,""); i++;
          while(i<lines.length && /^\s+\S/.test(lines[i]) && !/^\s*-\s+/.test(lines[i]) && !/^\s*[|#]/.test(lines[i])){
            item+=" "+lines[i].trim(); i++;
          }
          html+="<li>"+inline(item)+"</li>";
        }
        html+="</ul>"; continue;
      }
      // paragraph
      let para=[line]; i++;
      while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^\s*[|#]/.test(lines[i]) && !/^\s*-\s+/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      html+="<p>"+inline(para.join(" "))+"</p>";
    }
    return html;
  }

  (async function(){
    if(!id){ doc.innerHTML='<p class="msg">No project specified.</p>'; return; }
    document.getElementById("ghlink").href = REPO + id + ".md";
    try{
      const res = await fetch("./projects/" + id + ".md", {cache:"no-store"});
      if(!res.ok) throw new Error(res.status);
      const md = await res.text();
      doc.innerHTML = renderMd(md);
      const h1 = doc.querySelector("h1");
      if(h1) document.title = h1.textContent + " · Registry";
    }catch(e){
      doc.innerHTML = '<p class="msg">Could not load this project ("'+id+'").<br>It may not be logged yet.</p>';
    }
  })();
</script>
